[server]
protocol = https
domain = <hostname>
http_port = 3000
enforce_domain = true
root_url = https://<hostname>/<base-path>/grafana/
cert_file = /etc/grafana/ssl/grafana.crt
cert_key = /etc/grafana/ssl/grafana.key

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Editor